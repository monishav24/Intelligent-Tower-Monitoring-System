; PlatformIO Project Configuration File for ESP32 Telecom Tower USB Serial Firmware
; Build & Upload via Command Prompt:
;   cd esp32_firmware
;   pio run
;   pio run --target upload --upload-port COM3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^6.21.5
